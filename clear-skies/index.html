<title>맑은 하늘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one-screen ops console — header clock, a single scope panel, control strip below. */
  :root {
    --ink: #0d1726;       /* page ground: pre-dawn navy */
    --panel: #12233a;     /* scope surface */
    --line: #26405f;      /* rules, grid */
    --sky: #9fd0f5;       /* the clear-blue-sky accent */
    --amber: #f0b54a;     /* clock, warnings */
    --alert: #e8594f;     /* threats */
    --ok: #63c98f;        /* safe */
    --text: #e6eef7;
    --muted: #8aa1bb;
    --display: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--display); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { height: 100%; box-sizing: border-box; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #stageName { font-size: clamp(17px, 3.2vw, 22px); font-weight: 700; margin-top: 2px; text-wrap: balance; }
  #clock { font: 600 clamp(24px, 5vw, 34px) var(--mono); color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1; }
  #stage { flex: 1; min-height: 0; position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #cv { display: block; width: 100%; height: 100%; touch-action: manipulation; cursor: crosshair; }
  #ov { position: absolute; inset: 0; overflow-y: auto; background: color-mix(in srgb, var(--ink) 90%, transparent); display: flex; }
  #ov[hidden] { display: none; }
  #ov .inner { margin: auto; max-width: 560px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; }
  #ov h1 { margin: 0; font-size: clamp(34px, 8vw, 58px); line-height: 1; letter-spacing: -.02em; color: var(--sky); text-wrap: balance; }
  #ov h2 { margin: 0; font-size: clamp(22px, 5vw, 30px); text-wrap: balance; }
  #ov p { margin: 0; line-height: 1.7; color: var(--text); }
  #ov p.dim { color: var(--muted); font-size: 13px; }
  #ov ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  #ov li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
  #ov li b { font-family: var(--mono); }
  .tag { font: 600 12px var(--mono); padding: 2px 8px; border-radius: 3px; justify-self: start; }
  .t-ok { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .t-warn { background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); }
  .t-bad { background: color-mix(in srgb, var(--alert) 22%, transparent); color: var(--alert); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  button { font: 600 15px var(--display); color: var(--ink); background: var(--sky); border: 0; border-radius: 4px; padding: 12px 20px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: var(--alert); color: #fff; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  #controls { display: flex; gap: 10px; min-height: 48px; align-items: stretch; }
  #controls button { flex: 1; padding: 14px 10px; }
  #hint { font-size: 13px; color: var(--muted); line-height: 1.5; min-height: 1.5em; }
  .hr { display: flex; align-items: center; gap: 12px; }
  button.sm { padding: 6px 10px; font-size: 12px; }
  .rank { font: 700 clamp(64px, 16vw, 96px) var(--mono); color: var(--amber); line-height: 1; }
  kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow">2001년 9월 11일 · 화요일</div>
      <div id="stageName">맑은 하늘</div>
    </div>
    <div class="hr"><button id="mute" class="ghost sm" type="button">소리 켬</button><div id="clock">07:30</div></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ov"><div class="inner" id="ovInner"></div></div>
  </div>
  <div id="hint"></div>
  <div id="controls"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = {};
  ['ink','panel','line','sky','amber','alert','ok','text','muted'].forEach(k => C[k] = css('--' + k));
  const MONO = "'IBM Plex Mono', ui-monospace, Menlo, monospace";
  const SANS = "'IBM Plex Sans KR', system-ui, sans-serif";
  let W = 0, H = 0;
  function resize() {
    const r = $('#stage').getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * d); cv.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const fmt = m => { m = Math.floor(m); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  const FLIGHTS = [
    { id: 'AA11',  route: '보스턴 → 로스앤젤레스', org: 'BOS' },
    { id: 'UA175', route: '보스턴 → 로스앤젤레스', org: 'BOS' },
    { id: 'AA77',  route: '워싱턴 덜레스 → 로스앤젤레스', org: 'IAD' },
    { id: 'UA93',  route: '뉴어크 → 샌프란시스코', org: 'EWR' },
  ];
  let G; // game state
  let scene = null;
  let toasts = [];
  // ---------- juice: particles, floaters, shake, flash, sound ----------
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FX = { floats: [], parts: [], shake: 0, flash: 0, flashCol: '#fff' };
  function pop(x, y, text, col) { FX.floats.push({ x, y, text, col, t: 1 }); }
  function burst(x, y, col, n) { for (let k = 0; k < (n || 14); k++) { const a = rand(0, 6.28), v = rand(60, 260); FX.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(.35, .8), col }); } }
  function shake(a) { if (!REDUCED) FX.shake = Math.max(FX.shake, a); }
  function flash(col, a) { FX.flash = a || .3; FX.flashCol = col; }
  function fxUpdate(dt) {
    FX.shake = Math.max(0, FX.shake - dt * 40); FX.flash = Math.max(0, FX.flash - dt * 1.2);
    FX.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.t -= dt; });
    FX.parts = FX.parts.filter(p => p.t > 0);
    FX.floats.forEach(f => { f.y -= 40 * dt; f.t -= dt; }); FX.floats = FX.floats.filter(f => f.t > 0);
  }
  function fxDraw() {
    FX.parts.forEach(p => { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
    ctx.textAlign = 'center'; ctx.font = `700 20px ${SANS}`;
    FX.floats.forEach(f => { ctx.globalAlpha = Math.min(1, f.t * 2); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y); });
    if (FX.flash > 0) { ctx.globalAlpha = FX.flash; ctx.fillStyle = FX.flashCol; ctx.fillRect(-20, -20, W + 40, H + 40); }
    ctx.globalAlpha = 1;
  }
  function drawCombo(text, level) {
    const s = 1 + Math.min(0.5, level * 0.04) + 0.05 * Math.sin(performance.now() / 90);
    ctx.save(); ctx.translate(W / 2, H - 44); ctx.scale(s, s);
    ctx.textAlign = 'center'; ctx.font = `700 20px ${MONO}`; ctx.fillStyle = C.amber; ctx.fillText(text, 0, 0); ctx.restore();
  }
  let AC = null, muted = false;
  function tone(f, d, type, v, delay, f2) {
    const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || .15, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.03);
  }
  function sfx(k) {
    if (muted) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      switch (k) {
        case 'good': tone(660, .12, 'triangle', .18); tone(990, .2, 'triangle', .18, .09); break;
        case 'bad': tone(180, .22, 'square', .07, 0, 110); break;
        case 'tick': tone(1250, .05, 'sine', .05); break;
        case 'ping': tone(1500, .3, 'sine', .025, 0, 1350); break;
        case 'alarm': [880, 660, 880].forEach((f, i) => tone(f, .13, 'square', .05, i * .16)); break;
        case 'hit': tone(150, .09, 'sawtooth', .12, 0, 60); break;
        case 'lose': tone(320, .6, 'sawtooth', .09, 0, 70); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .15, i * .11)); break;
      }
    } catch (e) {}
  }
  $('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '소리 끔' : '소리 켬'; if (!muted) sfx('tick'); };
  const comboMult = () => 1 + Math.min(4, Math.floor(G.combo / 4));

  function toast(text, color) { toasts.push({ text, color: color || C.text, t: 2.4 }); if (toasts.length > 3) toasts.shift(); }

  // ---------- overlay & controls ----------
  function overlay(html, buttons) {
    $('#ovInner').innerHTML = html;
    const row = document.createElement('div'); row.className = 'row';
    (buttons || []).forEach(b => {
      const el = document.createElement('button'); el.textContent = b.label; if (b.cls) el.className = b.cls;
      el.onclick = b.go; row.appendChild(el);
    });
    $('#ovInner').appendChild(row);
    $('#ov').hidden = false;
    const f = row.querySelector('button'); if (f) f.focus();
  }
  function hideOverlay() { $('#ov').hidden = true; }
  function controls(list) {
    const c = $('#controls'); c.innerHTML = '';
    list.forEach(b => { const el = document.createElement('button'); el.innerHTML = b.label; if (b.cls) el.className = b.cls; el.onclick = b.go; c.appendChild(el); });
  }
  function header(eyebrow, name, hint) { $('#eyebrow').textContent = eyebrow; $('#stageName').textContent = name; $('#hint').innerHTML = hint || ''; }

  // ---------- title ----------
  function title() {
    scene = idleScene();
    header('2001년 9월 11일 · 화요일', '맑은 하늘', '');
    controls([]);
    $('#clock').textContent = '07:30';
    overlay(`
      <div class="eyebrow">가상의 아침</div>
      <h1>맑은 하늘</h1>
      <p>그날 아침 미국 동부의 하늘은 구름 한 점 없이 맑았습니다. 이번에는 당신이 그 아침을 지킵니다.</p>
      <ul>
        <li><b>1단계</b><span>쏟아지는 가방의 X선 화면에서 흉기를 직접 탭해 빼내세요.</span></li>
        <li><b>2단계</b><span>놓친 위협이 있다면, 관제 레이더에서 이상 신호를 보내는 항공기를 찾아 경보를 보내세요.</span></li>
        <li><b>3단계</b><span>경보가 늦었다면, 기내 보안요원이 되어 납치범에게 돌진해 조종실 문을 지키세요.</span></li>
      </ul>
      <p class="dim">실제 사건을 바탕으로 한 가상의 이야기입니다. 희생자와 유가족을 기리는 마음으로 만들었습니다.</p>`,
      [{ label: '근무 시작', go: startGame }]);
  }
  function idleScene() {
    return { update() {}, draw() { ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, H); drawSky(); } };
  }
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1d3d63'); g.addColorStop(1, C.panel);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function startGame() {
    G = { score: 0, combo: 0, flights: {} }; sfx('good');
    FLIGHTS.forEach(f => G.flights[f.id] = { ...f, threats: 0, missed: 0, status: 'clear' });
    hideOverlay();
    scene = checkpointScene();
  }

  // ---------- STAGE 1: checkpoint ----------
  const SAFE = [['💻','노트북'],['📚','책'],['👕','셔츠'],['📱','휴대폰'],['🔑','열쇠'],['📷','카메라'],['👓','안경'],['🎧','헤드폰'],
    ['👛','지갑'],['☂️','우산'],['🍎','사과'],['🖊️','볼펜'],['🔦','손전등'],['🧦','양말'],['⏰','시계'],['🪥','칫솔'],['✏️','연필'],['🧸','인형'],['🥤','음료'],['💿','CD']];
  const DANGER = [['🔪','커터칼'],['🗡️','단검'],['🪒','면도칼']];
  const KEYS = new Set();

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawToasts() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    toasts.forEach((t, k) => {
      ctx.globalAlpha = Math.min(1, t.t * 2);
      ctx.font = `600 14px ${SANS}`; ctx.fillStyle = t.color;
      ctx.fillText(t.text, W / 2, 30 + k * 22);
    });
    ctx.globalAlpha = 1;
  }

  function checkpointScene() {
    const DUR = 40;
    let t = 0, stun = 0, rushShown = false;
    const st = { caught: 0, missed: 0, wrong: 0 };
    const bags = [];
    header('1단계 · 공항 보안검색대', 'X선 화면에서 흉기를 탭하세요',
      'X선 창 안의 <b>커터칼·단검·면도칼</b>을 직접 탭해서 빼내세요. 다른 물건을 누르면 잠깐 멈칫합니다. 금색 ★ 가방엔 흉기가 여러 개!');
    controls([]);
    const geo = () => {
      const bh = Math.min(112, H * 0.24), bw = bh * 1.55, beltY = H * 0.5;
      const sw = Math.min(W - 16, Math.max(bw * 1.7, W * 0.72));
      return { bw, bh, beltY, sx: (W - sw) / 2, sw, sy: beltY - bh / 2 - 28, sh: bh + 56 };
    };
    function makeBag(x) {
      const p = Math.min(0.55, 0.3 + t / DUR * 0.25);
      const star = t > 6 && Math.random() < 0.12;
      const nThreat = star ? 2 + (Math.random() < .5 ? 1 : 0) : (Math.random() < p ? 1 : 0);
      const n = Math.min(6, Math.max(3 + (Math.random() * 3 | 0), nThreat + 2));
      const cells = shuffle([0, 1, 2, 3, 4, 5]);
      const items = [];
      for (let k = 0; k < n; k++) {
        const bad = k < nThreat, src = bad ? pick(DANGER) : pick(SAFE);
        items.push({ e: src[0], l: src[1], c: cells[k], r: rand(-.7, .7), bad, gone: false });
      }
      bags.push({ x, flight: pick(FLIGHTS).id, items, star, checked: false });
    }
    function itemPos(b, it, g) { const cw = g.bw / 3, ch = g.bh / 2; return [b.x + cw * (it.c % 3 + .5), g.beltY - g.bh / 2 + ch * ((it.c / 3 | 0) + .45)]; }
    function finish() {
      scene = idleScene(); controls([]);
      FLIGHTS.forEach(f => { const s = G.flights[f.id]; if (s.missed > 0) s.status = 'boarded'; });
      const boarded = FLIGHTS.filter(f => G.flights[f.id].status === 'boarded');
      const list = FLIGHTS.map(f => {
        const s = G.flights[f.id];
        return `<li><b>${f.id}</b><span class="tag ${s.missed ? 't-bad' : 't-ok'}">${s.missed ? `흉기 ${s.missed}개 반입` : '위협 차단'}</span></li>`;
      }).join('');
      sfx(boarded.length ? 'bad' : 'win');
      overlay(`
        <div class="eyebrow">08:00 · 탑승 마감</div>
        <h2>${boarded.length === 0 ? '모든 흉기를 지상에서 막았습니다' : `${boarded.length}개 항공편에 위협이 탑승했습니다`}</h2>
        <p>압수 ${st.caught} · 놓침 ${st.missed} · 잘못 누름 ${st.wrong} · 점수 ${G.score}</p>
        <ul>${list}</ul>
        <p class="dim">${boarded.length ? '아직 끝나지 않았습니다. 항공기가 이륙합니다. 관제 레이더로 이동하세요.' : '네 항공편 모두 평범한 비행을 시작합니다.'}</p>`,
        [{ label: boarded.length ? '관제실로' : '결과 보기', go: () => { hideOverlay(); boarded.length ? (scene = radarScene()) : ending(); } }]);
    }
    const self = {
      click(px, py) {
        const g = geo();
        if (px < g.sx || px > g.sx + g.sw || py < g.sy || py > g.sy + g.sh) return;
        if (stun > 0) { sfx('bad'); return; }
        let best = null, bb = null, bd = 32;
        bags.forEach(b => b.items.forEach(it => {
          if (it.gone) return; const [x, y] = itemPos(b, it, g);
          if (x < g.sx || x > g.sx + g.sw) return;
          const d = Math.hypot(x - px, y - py); if (d < bd) { bd = d; best = it; bb = b; }
        }));
        if (!best) return;
        const [x, y] = itemPos(bb, best, g);
        if (best.bad) {
          best.gone = true; st.caught++; G.combo++;
          const pts = (bb.star ? 150 : 100) * comboMult(); G.score += pts;
          pop(x, y - 22, `+${pts}`, C.ok); burst(x, y, C.ok, 22); sfx('good');
          if (G.combo % 5 === 0) { toast(`${G.combo} 연속 압수!`, C.amber); flash(C.amber, .15); }
          if (bb.items.every(i => !i.bad || i.gone) && bb.star) { pop(W / 2, g.sy - 10, '★ 보너스 가방 클리어!', C.amber); }
        } else {
          st.wrong++; G.combo = 0; G.score = Math.max(0, G.score - 30); stun = 0.6;
          pop(x, y - 22, `${best.l}? -30`, C.amber); shake(6); sfx('bad');
        }
      },
      update(dt) {
        t += dt; stun -= dt;
        $('#clock').textContent = fmt(7 * 60 + 35 + Math.min(1, t / DUR) * 25);
        const g = geo();
        const v = 75 + Math.min(1, t / DUR) * 115;
        if (!rushShown && t > DUR * 0.65) { rushShown = true; toast('러시 아워! 벨트가 빨라집니다', C.amber); sfx('alarm'); }
        bags.forEach(b => b.x += v * dt);
        const leftmost = bags.length ? Math.min(...bags.map(b => b.x)) : 1e9;
        if (t < DUR && leftmost > 18) makeBag(-g.bw - rand(0, 40));
        for (let k = bags.length - 1; k >= 0; k--) {
          const b = bags[k];
          if (!b.checked && b.x + g.bw / 6 > g.sx + g.sw) {
            b.checked = true;
            const left = b.items.filter(i => i.bad && !i.gone).length;
            if (left) {
              st.missed += left; G.combo = 0; G.flights[b.flight].missed += left;
              toast(`놓쳤다! ${b.flight}에 흉기 반입`, C.alert); flash(C.alert, .3); shake(10); sfx('lose');
            }
          }
          if (b.x > W + 10) bags.splice(k, 1);
        }
        if (t >= DUR && bags.every(b => b.checked)) finish();
      },
      draw() {
        const g = geo();

        if (P.dash > 0) { P.x += P.dx * spd * dt; P.y += P.dy * spd * dt; }
        else if (ml) { P.x += mx / ml * spd * dt; P.y += my / ml * spd * dt; }
        P.x = Math.max(g.x0 + 14, Math.min(g.x0 + g.cw - 14, P.x)); P.y = Math.max(g.door + 14, Math.min(g.bot, P.y));
        // hijackers
        let banging = false;
        hij.forEach(h => {
          if (h.down) return;
          const d = Math.hypot(h.x - P.x, h.y - P.y);
          if (d < h.r + P.r + 2) {
            if (P.dash > 0 && h.type !== 'big') { subdue(h, true); return; }
            h.prog += dt * (P.dash > 0 ? 3 : 1); h.stun = Math.max(h.stun, 0.12);
            if (h.prog >= h.need) { subdue(h, P.dash > 0); return; }
          } else h.prog = Math.max(0, h.prog - dt * 0.5);
          if (h.stun > 0) { h.stun -= dt; return; }
          const ax = W / 2;
          if (Math.abs(h.x - ax) > 3) { h.x += Math.sign(ax - h.x) * Math.min(Math.abs(ax - h.x), h.sp * 1.2 * dt); h.y -= h.sp * 0.25 * dt; }
          else if (h.y > g.door + 14) h.y -= h.sp * dt;
          if (h.y <= g.door + 16 && Math.abs(h.x - ax) < 6) {
            h.y = g.door + 14; banging = true;
            door -= dt * (h.type === 'big' ? 14 : 9);
          }
        });
        // keep hijackers from stacking perfectly
        for (let a = 0; a < hij.length; a++) for (let b = a + 1; b < hij.length; b++) {
          const A = hij[a], B = hij[b]; if (A.down || B.down) continue;
          const d = Math.hypot(A.x - B.x, A.y - B.y), m = A.r + B.r;
          if (d < m && d > 0.01) { const push = (m - d) / 2; const ux = (A.x - B.x) / d, uy = (A.y - B.y) / d; A.y += uy * push; B.y -= uy * push; A.x += ux * push * .3; B.x -= ux * push * .3; }
        }
        if (banging) { bangT -= dt; if (bangT <= 0) { bangT = 0.45; sfx('hit'); shake(4); } }
        // rally button label
        const label = courage >= 1 ? '승객 돌격! <kbd>E</kbd>' : `승객 돌격 ${Math.round(courage * 100)}%`;
        if (label !== lastLabel) { rallyBtn.innerHTML = label; rallyBtn.disabled = courage < 1; lastLabel = label; }
        if (door <= 0) { door = 0; end(false); }
        else if (spawned >= TOTAL && hij.every(h => h.down)) end(true);
      },
      draw() {
        const g = geo();
        ctx.fillStyle = C.panel; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#1b3150'; roundRect(g.x0, g.door - 28, g.cw, g.bot - g.door + 48, 40); ctx.fill();
        ctx.fillStyle = '#142640'; ctx.fillRect(W / 2 - 20, g.door, 40, g.bot - g.door + 16);
        // seats
        const rows = Math.max(6, Math.floor((g.bot - g.top) / 28));
        const seatW = (g.cw / 2 - 20 - 12) / 3;
        for (let r = 0; r < rows; r++) {
          const y = g.top + r * 28;
          for (const s of [-1, 1]) for (let c = 0; c < 3; c++) {
            const x = s < 0 ? g.x0 + 8 + c * seatW : W / 2 + 22 + c * seatW;
            ctx.fillStyle = '#2a4466'; roundRect(x + 1, y, seatW - 3, 18, 4); ctx.fill();
            if ((r * 7 + c * 3 + (s > 0 ? 1 : 0)) % 4) { ctx.fillStyle = '#7fa8cf'; ctx.beginPath(); ctx.arc(x + seatW / 2 - 1, y + 9, 4, 0, Math.PI * 2); ctx.fill(); }
          }
        }
        // door + HP
        const dc = door > 50 ? C.amber : C.alert;
        ctx.fillStyle = dc; ctx.fillRect(W / 2 - 26, g.door - 6, 52, 7);
        ctx.fillStyle = C.line; ctx.fillRect(W / 2 - 50, g.door - 22, 100, 6);
        ctx.fillStyle = dc; ctx.fillRect(W / 2 - 50, g.door - 22, door, 6);
        ctx.fillStyle = C.muted; ctx.font = `600 10px ${MONO}`; ctx.textAlign = 'center'; ctx.fillText(`조종실 문 ${Math.round(door)}%`, W / 2, g.door - 28);
        // hijackers
        hij.forEach(h => {
          if (h.down) {
            ctx.fillStyle = C.muted; ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 0.8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = C.sky; for (let a = 0; a < 3; a++) { ctx.beginPath(); ctx.arc(h.x + Math.cos(a * 2.1) * (h.r + 4), h.y + Math.sin(a * 2.1) * (h.r + 4), 4, 0, Math.PI * 2); ctx.fill(); }
            return;
          }
          const col = h.type === 'fast' ? '#ff8a5c' : h.type === 'big' ? '#b8322a' : C.alert;
          if (h.type === 'fast' && h.stun <= 0) { ctx.globalAlpha = .3; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(h.x, h.y + 10, h.r * .8, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
          ctx.fillStyle = h.stun > 0.3 ? '#fff' : col; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
          if (h.type === 'big') { ctx.strokeStyle = C.alert; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 4, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
          if (h.prog > 0) { ctx.strokeStyle = C.ok; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, h.r + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, h.prog / h.need)); ctx.stroke(); ctx.lineWidth = 1; }
        });
        // player
        if (P.dash > 0) { ctx.fillStyle = 'rgba(159,208,245,0.35)'; for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(P.x - P.dx * k * 10, P.y - P.dy * k * 10, P.r - k * 2, 0, Math.PI * 2); ctx.fill(); } }
        ctx.fillStyle = C.sky; ctx.beginPath(); ctx.arc(P.x, P.y, P.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(P.x + P.dx * 5, P.y + P.dy * 5, 3, 0, Math.PI * 2); ctx.fill();
        if (P.cd > 0) { ctx.strokeStyle = C.muted; ctx.beginPath(); ctx.arc(P.x, P.y, P.r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - P.cd / 1.3)); ctx.stroke(); }
        // danger vignette
        const danger = door < 100 && hij.some(h => !h.down && h.y <= g.door + 20) ? 1 : 0;
        if (danger && !over) {
          const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
          gr.addColorStop(0, 'rgba(232,89,79,0)'); gr.addColorStop(1, `rgba(232,89,79,${0.3 + 0.2 * Math.sin(t * 12)})`);
          ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
        }
        // HUD
        const left = TOTAL - hij.filter(h => h.down).length;
        ctx.fillStyle = C.muted; ctx.font = `12px ${MONO}`; ctx.textAlign = 'left'; ctx.fillText(`남은 납치범 ${left}`, 12, H - 10);
        ctx.textAlign = 'right'; ctx.fillText(`점수 ${G.score}`, W - 12, H - 10);
        ctx.fillStyle = C.line; ctx.fillRect(12, H - 30, 90, 5); ctx.fillStyle = courage >= 1 ? C.amber : C.sky; ctx.fillRect(12, H - 30, 90 * courage, 5);
        drawToasts();
      },
    };
    return self;
  }

  // ---------- ending ----------
  function ending() {
    scene = idleScene(); controls([]);
    header('2001년 9월 11일 · 오전', '결과', '');
    const safe = FLIGHTS.filter(f => G.flights[f.id].status !== 'lost').length;
    const list = FLIGHTS.map(f => {
      const s = G.flights[f.id].status;
      const [cls, tx] = { clear: ['t-ok', '지상에서 위협 차단'], diverted: ['t-ok', '경보 후 안전 착륙'], retaken: ['t-warn', '승객들이 되찾음'], lost: ['t-bad', '지키지 못함'] }[s] || ['t-ok', '안전'];
      return `<li><b>${f.id}</b><span class="tag ${cls}">${tx}</span></li>`;
    }).join('');
    const ground = FLIGHTS.filter(f => G.flights[f.id].status === 'clear').length;
    const rank = safe === 4 ? (ground === 4 && G.score >= 600 ? 'S' : 'A') : safe === 3 ? 'B' : safe >= 1 ? 'C' : 'D';
    let best = 0, newBest = false;
    try { best = +localStorage.getItem('clearSkiesBest') || 0; if (G.score > best) { localStorage.setItem('clearSkiesBest', G.score); newBest = best > 0; best = G.score; } } catch (e) { best = G.score; }
    sfx(safe === 4 ? 'win' : safe ? 'good' : 'lose');
    const head = safe === 4 ? '하늘은 맑은 채로 남았습니다' : safe === 0 ? '오늘은 막지 못했습니다' : `${safe}대의 항공기를 지켰습니다`;
    overlay(`
      <div class="eyebrow">등급</div>
      <div class="rank">${rank}</div>
      <h1>${head}</h1>
      <p>최종 점수 <b>${G.score}</b> · 최고 기록 ${best}${newBest ? ' · <b style="color:var(--amber)">신기록!</b>' : ''}</p>
      <ul>${list}</ul>
      <p>실제 2001년 9월 11일에는 네 대의 항공기가 납치되어 2,977명이 목숨을 잃었습니다. UA93편의 승객과 승무원은 조종실을 되찾으려 맞섰고, 그 비행기는 목표에 닿지 못했습니다.</p>
      <p class="dim">이 게임은 그날의 희생자와 구조에 나선 모든 이들을 기억하기 위한 가상의 이야기입니다.</p>`,
      [{ label: '다시 근무하기', go: startGame }, { label: '처음 화면', cls: 'ghost', go: title }]);
  }

  // ---------- input & loop ----------
  const ptr = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => {
    if (!scene) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const [x, y] = ptr(e);
    if (scene.click) scene.click(x, y);
    if (scene.pdown) scene.pdown(x, y);
  });
  cv.addEventListener('pointermove', e => { if (scene && scene.pmove) { const [x, y] = ptr(e); scene.pmove(x, y); } });
  addEventListener('pointerup', () => { if (scene && scene.pup) scene.pup(); });
  addEventListener('pointercancel', () => { if (scene && scene.pup) scene.pup(); });
  addEventListener('keydown', e => {
    KEYS.add(e.key.toLowerCase());
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase()) && $('#ov').hidden) e.preventDefault();
    if (scene && scene.key && $('#ov').hidden) scene.key(e);
  });
  addEventListener('keyup', e => KEYS.delete(e.key.toLowerCase()));
  addEventListener('blur', () => KEYS.clear());
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (W === 0) resize();
    toasts.forEach(t => t.t -= dt); toasts = toasts.filter(t => t.t > 0);
    if (scene) {
      if ($('#ov').hidden) scene.update(dt);
      fxUpdate(dt);
      ctx.save(); if (FX.shake > 0) ctx.translate(rand(-FX.shake, FX.shake), rand(-FX.shake, FX.shake));
      scene.draw(); fxDraw(); ctx.restore();
    }
    requestAnimationFrame(loop);
  }
  title();
  requestAnimationFrame(loop);
})();
</script>
